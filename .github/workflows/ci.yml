# Alarme do push direto na main (TASK-0041). Não bloqueia a Vercel: avisa por e-mail do GitHub quando falha.
# Repositório público: Actions sem custo. Sem secrets: só código público e a URL pública de produção.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event.deployment.id || github.sha }}
  cancel-in-progress: false

jobs:
  test-build:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: index.html sem script inline (CSP)
        run: |
          if grep -E '<script' dist/index.html | grep -vq ' src='; then
            echo "dist/index.html tem script inline"; exit 1
          fi

  functions-test:
    # Edge Functions (ADR-0017): checagem de tipos no Deno e testes Deno, se houver. Sem deploy, sem token, sem secrets.
    # A lógica da cnpj-lookup também é testada no Node (scripts/test-cnpj-lookup.mjs, dentro do npm test).
    # --node-modules-dir=none: o package.json da raiz (front) põe o Deno no modo manual, que exige node_modules;
    # none resolve os npm: da função pelo cache global do Deno, como no Edge Runtime.
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Há funções no repositório?
        id: has
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "sem supabase/functions: nada a testar"; fi
      - if: steps.has.outputs.run == 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tipos (deno check)
        if: steps.has.outputs.run == 'true'
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts
      - name: Testes Deno, sem permissão de rede
        if: steps.has.outputs.run == 'true'
        run: |
          if ls supabase/functions/*/*_test.ts supabase/functions/*/*.test.ts >/dev/null 2>&1; then
            deno test --node-modules-dir=none supabase/functions/
          else
            echo "sem testes Deno; a lógica é testada no npm test"
          fi

  production-smoke:
    # A Vercel publica deployment_status no GitHub. Só o deploy de Production concluído com sucesso.
    if: github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE: https://fala-ai-brasil.vercel.app
      # "false" até o primeiro deploy da cnpj-lookup (runbook EDGE_FUNCTION_DEPLOY, passo 11); depois "true".
      CNPJ_LOOKUP_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - name: Landing, bundle e cabeçalho CSP
        run: |
          set -eu
          sleep 20
          curl -fsS -D headers.txt -o index.html "$SITE/"
          # Nome e valor do cabeçalho vêm do vercel.json do commit: vale para Report-Only (fase 1) e para a fase 2.
          name=$(node -e 'console.log(require("./vercel.json").headers[0].headers[0].key)')
          expected=$(node -e 'console.log(require("./vercel.json").headers[0].headers[0].value)')
          served=$(grep -i "^$name:" headers.txt | sed 's/^[^:]*: //' | tr -d '\r')
          if [ "$served" != "$expected" ]; then
            echo "$name servido difere do vercel.json do commit"; echo "servido:  $served"; echo "esperado: $expected"; exit 1
          fi
          js=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' index.html | head -1)
          [ -n "$js" ] || { echo "landing sem bundle principal"; exit 1; }
          curl -fsS -o /dev/null "$SITE$js"
          echo "ok: landing 200, bundle $js 200, CSP igual ao vercel.json"
          curl -fsS -o bundle.js "$SITE$js"
      - name: Edge Function cnpj-lookup recusa sem login
        run: |
          set -eu
          # URL do projeto vem do vercel.json (CSP) e a chave publicável do bundle: ambas públicas.
          api=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' vercel.json | head -1)
          [ -n "$api" ] || { echo "URL do Supabase não encontrada no vercel.json"; exit 1; }
          fn="$api/functions/v1/cnpj-lookup"
          sem=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$fn" -H 'content-type: application/json' -d '{}')
          pub=$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' bundle.js | head -1 || true)
          if [ -n "$pub" ]; then
            com=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$fn" -H 'content-type: application/json' -H "apikey: $pub" -H "authorization: Bearer $pub" -d '{}')
          else
            com=skip
          fi
          echo "sem credencial: $sem; só chave publicável: $com"
          if [ "$CNPJ_LOOKUP_REQUIRED" = "true" ]; then
            [ "$sem" = "401" ] || { echo "esperado 401 sem login"; exit 1; }
            [ "$com" = "401" ] || { echo "esperado 401 só com a chave publicável (ADR-0017 D3)"; exit 1; }
          else
            # Antes do primeiro deploy a função não existe (404). Qualquer coisa além de 401/404 é alarme.
            case "$sem" in 401|404) ;; *) echo "resposta inesperada sem login: $sem"; exit 1;; esac
            case "$com" in 401|404|skip) ;; *) echo "resposta inesperada só com a chave publicável: $com"; exit 1;; esac
          fi
